<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生产设备预测性维护与智能运维平台</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg class="logo-icon" viewBox="0 0 24 24" fill="none">
                        <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="currentColor" stroke-width="2"/>
                        <path d="M2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2"/>
                    </svg>
                    <span class="logo-text">预测性维护平台</span>
                </div>
            </div>
            <nav class="nav-menu">
                <a class="nav-item active" data-page="overview">
                    <svg viewBox="0 0 24 24" class="nav-icon"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" fill="currentColor"/></svg>
                    <span>总览看板</span>
                </a>
                <a class="nav-item" data-page="equipment">
                    <svg viewBox="0 0 24 24" class="nav-icon"><path d="M22 9V7h-3V5c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H8v2H6v2H4v2H2v4h2v2h2v-2h2v-2h2v-2h2v-2h2v2h2v2h2v2h2v2h2v-4h-2v-2h-2v-2h-2V9z" fill="currentColor"/></svg>
                    <span>设备监控</span>
                </a>
                <a class="nav-item" data-page="alerts">
                    <svg viewBox="0 0 24 24" class="nav-icon"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5S10.5 3.17 10.5 4v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" fill="currentColor"/></svg>
                    <span>告警中心</span>
                </a>
                <a class="nav-item" data-page="workorders">
                    <svg viewBox="0 0 24 24" class="nav-icon"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-2 14l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z" fill="currentColor"/></svg>
                    <span>维修工单</span>
                </a>
                <a class="nav-item" data-page="diagnosis">
                    <svg viewBox="0 0 24 24" class="nav-icon"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z" fill="currentColor"/></svg>
                    <span>故障诊断</span>
                </a>
                <a class="nav-item" data-page="knowledge">
                    <svg viewBox="0 0 24 24" class="nav-icon"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" fill="currentColor"/></svg>
                    <span>知识图谱</span>
                </a>
                <a class="nav-item" data-page="settings">
                    <svg viewBox="0 0 24 24" class="nav-icon"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z" fill="currentColor"/></svg>
                    <span>系统设置</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="status-badge" id="systemStatusBadge">
                    <span class="status-dot running"></span>
                    <span>系统运行中</span>
                </div>
                <div class="version">v1.0.0</div>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 总览看板 -->
            <section id="page-overview" class="page active">
                <div class="page-header">
                    <h1>总览看板</h1>
                    <div class="header-actions">
                        <button class="btn btn-sm" onclick="injectFaultDialog()">注入故障</button>
                        <button class="btn btn-sm" onclick="loadOverview()">刷新</button>
                    </div>
                </div>
                <div class="kpi-row" id="kpiRow"></div>
                <div class="overview-grid">
                    <div class="card">
                        <div class="card-header">
                            <h3>设备健康度分布</h3>
                        </div>
                        <div class="card-body">
                            <div id="healthDistChart" class="chart-container"></div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header">
                            <h3>告警统计</h3>
                        </div>
                        <div class="card-body">
                            <div id="alertStatsChart" class="chart-container"></div>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h3>设备状态概览</h3>
                        <div class="header-actions">
                            <button class="btn btn-sm" onclick="autoRefreshToggle()" id="autoRefreshBtn">自动刷新: 开</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="equipmentOverview" class="equipment-grid"></div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h3>最近告警</h3>
                    </div>
                    <div class="card-body">
                        <div id="recentAlertsTable"></div>
                    </div>
                </div>
            </section>

            <!-- 设备监控 -->
            <section id="page-equipment" class="page">
                <div class="page-header">
                    <h1>设备监控</h1>
                    <div class="header-actions">
                        <button class="btn btn-sm btn-primary" onclick="showAddEquipmentDialog()">添加设备</button>
                    </div>
                </div>
                <div id="equipmentList" class="equipment-grid"></div>
            </section>

            <!-- 设备详情 -->
            <section id="page-equipment-detail" class="page">
                <div class="page-header">
                    <div class="back-btn" onclick="switchPage('equipment')">
                        <svg viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor"/></svg>
                        返回
                    </div>
                    <h1 id="detailTitle">设备详情</h1>
                </div>
                <div id="equipmentDetailContent"></div>
            </section>

            <!-- 告警中心 -->
            <section id="page-alerts" class="page">
                <div class="page-header">
                    <h1>告警中心</h1>
                    <div class="header-actions">
                        <select id="alertFilter" class="filter-select" onchange="loadAlerts()">
                            <option value="">全部级别</option>
                            <option value="emergency">紧急</option>
                            <option value="critical">严重</option>
                            <option value="warning">警告</option>
                            <option value="info">信息</option>
                        </select>
                        <select id="alertAckFilter" class="filter-select" onchange="loadAlerts()">
                            <option value="">全部状态</option>
                            <option value="0">未确认</option>
                            <option value="1">已确认</option>
                        </select>
                    </div>
                </div>
                <div id="alertsList"></div>
            </section>

            <!-- 维修工单 -->
            <section id="page-workorders" class="page">
                <div class="page-header">
                    <h1>维修工单</h1>
                    <div class="header-actions">
                        <select id="orderStatusFilter" class="filter-select" onchange="loadWorkOrders()">
                            <option value="">全部状态</option>
                            <option value="pending">待处理</option>
                            <option value="in_progress">进行中</option>
                            <option value="completed">已完成</option>
                            <option value="cancelled">已取消</option>
                        </select>
                    </div>
                </div>
                <div id="workOrdersList"></div>
            </section>

            <!-- 故障诊断 -->
            <section id="page-diagnosis" class="page">
                <div class="page-header">
                    <h1>故障诊断</h1>
                </div>
                <div id="diagnosisContent"></div>
            </section>

            <!-- 知识图谱 -->
            <section id="page-knowledge" class="page">
                <div class="page-header">
                    <h1>故障知识图谱</h1>
                    <div class="header-actions">
                        <input type="text" id="kgSearchInput" class="filter-input" placeholder="搜索节点..." onkeyup="searchKG(event)">
                    </div>
                </div>
                <div class="card">
                    <div class="card-body">
                        <div id="kgGraph" class="kg-container"></div>
                        <div id="kgDetail" class="kg-detail-panel"></div>
                    </div>
                </div>
            </section>

            <!-- 系统设置 -->
            <section id="page-settings" class="page">
                <div class="page-header">
                    <h1>系统设置</h1>
                </div>
                <div id="settingsContent"></div>
            </section>
        </main>
    </div>

    <!-- 模态框 -->
    <div id="modal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">标题</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast" style="display:none;"></div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/knowledge_graph.js"></script>
</body>
</html>
